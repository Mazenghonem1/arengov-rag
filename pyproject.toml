[project]
name = "arengov"
version = "0.1.0"
description = "Bilingual Arabic-English RAG assistant over public UAE government-services pages"
readme = "README.md"
authors = [
    { name = "Mazen Ghonem", email = "167409228+Mazenghonem1@users.noreply.github.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "numpy>=2.5.4",
    "openai>=3.49.0",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.3.0",
    "snowballstemmer>=3.1.1",
    "tokenizers>=0.23.3",
    "torch>=2.11.0",
]

[project.scripts]
arengov = "arengov.__main__:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: loads ML models or uses the network"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cuda", marker = "sys_platform == 'win32'" },
  { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]
